<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle subtle -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="url(#bookGrad)" stroke-width="2" />
  
  <!-- Glowing back spine -->
  <path d="M32 14 L32 50" stroke="#a855f7" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Left open book pages -->
  <path d="M32 16 C24 12 14 14 10 18 L10 46 C15 42 24 41 32 46 Z" fill="url(#bookGrad)" opacity="0.9" />
  <path d="M32 20 C25 17 16 19 12 22 L12 47 C16 44 24 43 32 48 Z" fill="#4338ca" opacity="0.6" />
  
  <!-- Right open book pages -->
  <path d="M32 16 C40 12 50 14 54 18 L54 46 C49 42 40 41 32 46 Z" fill="url(#glowGrad)" opacity="0.9" />
  <path d="M32 20 C39 17 48 19 52 22 L52 47 C48 44 40 43 32 48 Z" fill="#0284c7" opacity="0.6" />
  
  <!-- Sparkles / AI Recommender Nodes -->
  <circle cx="21" cy="28" r="2" fill="#ffffff" />
  <circle cx="43" cy="28" r="2" fill="#ffffff" />
  <circle cx="32" cy="26" r="2.5" fill="#fef08a" filter="url(#glow)" />
  <path d="M21 28 L32 26 L43 28" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" opacity="0.8" />
  <circle cx="32" cy="11" r="1.5" fill="#38bdf8" />
  <polygon points="32,7 33.5,10.5 37,11 34.5,13.5 35,17 32,15 29,17 29.5,13.5 27,11 30.5,10.5" fill="#fbbf24" />
</svg>
